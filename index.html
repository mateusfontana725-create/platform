<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudos Fontana</title>
<meta name="description" content="Plataforma de estudos Fontana: resumos e quizzes por matéria.">
<link rel="stylesheet" href="assets/estudos.css">
</head>
<body>
<div class="wrap">
  <header class="site-header"><div class="in">
    <a class="brand" href="index.html"><span class="logo">EF</span><span>Estudos Fontana</span></a>
  </div></header>

  <section class="hero">
    <p class="eyebrow">Plataforma de estudos</p>
    <h1>O que vamos estudar hoje?</h1>
    <p class="longo">Escolha uma matéria, leia o resumo e treine no quiz. Cada questão traz dica, correção na hora e duas explicações: uma técnica e outra em palavras simples.</p>
    <div class="hero-stats" id="stats"></div>
  </section>

  <h2 class="section-title">Matérias <span class="count" id="conta"></span></h2>
  <div class="busca-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="busca" class="busca" placeholder="Buscar matéria por nome, sigla ou assunto" aria-label="Buscar matéria" autocomplete="off">
  </div>
  <div class="grid" id="lista"></div>
  <p class="muted" id="vazio" hidden style="margin-top:14px">Nenhuma matéria encontrada.</p>
</div>

<script src="assets/materias.js"></script>
<script>
(function () {
  var lista = document.getElementById('lista');
  var vazio = document.getElementById('vazio');
  var busca = document.getElementById('busca');
  var conta = document.getElementById('conta');
  // as mais recentes (últimas do registro) aparecem primeiro
  var mats = (window.MATERIAS || []).slice().reverse();
  function norm(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function card(m) {
    var resumo = m.resumo ? '<span class="chip on">Resumo</span>' : '<span class="chip off">Resumo em breve</span>';
    var quiz = m.quiz ? '<span class="chip on">Quiz</span>' : '<span class="chip off">Quiz em breve</span>';
    return '<a class="card' + (m.resumo || m.quiz ? '' : ' embreve') + '" href="materia.html?m=' + encodeURIComponent(m.id) + '" style="--cor:' + m.cor + '">' +
      '<div class="topo"><div class="sigla">' + m.sigla + '</div>' +
      '<h2>' + m.nome + '</h2><span class="seta" aria-hidden="true">›</span></div>' +
      '<p>' + m.descricao + '</p>' +
      '<div class="chips">' + resumo + quiz + '</div>' +
      '</a>';
  }
  function mostra() {
    var termos = norm(busca.value).split(/\s+/).filter(Boolean);
    var vis = mats.filter(function (m) {
      var alvo = norm(m.nome + ' ' + m.sigla + ' ' + m.descricao);
      return termos.every(function (t) { return alvo.indexOf(t) >= 0; });
    });
    lista.innerHTML = vis.map(card).join('');
    conta.textContent = termos.length ? vis.length + ' de ' + mats.length : mats.length + ' no total';
    vazio.hidden = vis.length > 0;
  }
  if (!mats.length) {
    busca.hidden = true;
    lista.innerHTML = '<div class="panel muted">Nenhuma matéria cadastrada ainda.</div>';
    return;
  }
  var nRes = mats.filter(function (m) { return m.resumo; }).length;
  var nQuiz = mats.filter(function (m) { return m.quiz; }).length;
  document.getElementById('stats').innerHTML = '<span><b>' + mats.length + '</b> matérias</span><span><b>' + nRes + '</b> com resumo</span><span><b>' + nQuiz + '</b> com quiz</span>';
  busca.addEventListener('input', mostra);
  mostra();
})();
</script>
</body>
</html>
