<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matéria · Estudos Fontana</title>
<link rel="stylesheet" href="assets/estudos.css">
</head>
<body>
<div class="wrap">
  <header class="site-header"><div class="in">
    <a class="brand" href="index.html"><span class="logo">EF</span><span>Estudos Fontana</span></a>
    <a class="nav-link" href="index.html">Todas as matérias</a>
  </div></header>

  <nav class="crumbs" aria-label="Trilha"><a href="index.html">Início</a><span class="sep">›</span><span id="crumb-nome">Matéria</span></nav>

  <section class="hero" id="hero">
    <div class="hero-sigla" id="sigla" hidden></div>
    <h1 id="titulo">Matéria</h1>
    <p id="descricao"></p>
  </section>

  <h2 class="section-title">O que você quer fazer?</h2>
  <div class="modos" id="modos"></div>
  <p class="muted small" id="dica-offline" hidden style="margin-top:14px">Para estudar sem internet, baixe o resumo em PDF e o quiz em um único arquivo .html. O quiz baixado abre direto no navegador do celular ou do computador.</p>
</div>

<script src="assets/materias.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('m');
  var m = id && window.achaMateria ? window.achaMateria(id) : null;
  var hero = document.getElementById('hero');
  if (!m) {
    document.getElementById('titulo').textContent = 'Matéria não encontrada';
    document.getElementById('descricao').textContent = 'Volte à lista e escolha outra matéria.';
    document.getElementById('modos').innerHTML = '';
    document.getElementById('crumb-nome').textContent = 'Não encontrada';
    return;
  }
  document.title = m.nome + ' · Estudos Fontana';
  document.getElementById('titulo').textContent = m.nome;
  document.getElementById('descricao').textContent = m.descricao;
  document.getElementById('crumb-nome').textContent = m.nome;
  document.body.style.setProperty('--cor', m.cor);
  var sg = document.getElementById('sigla'); sg.textContent = m.sigla; sg.hidden = false;
  var ICO = {
    resumo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg>',
    quiz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>'
  };

  function modo(href, ico, titulo, texto, ok, emBreve, arquivo, rotuloBaixar) {
    var card = ok
      ? '<a class="mode" href="' + href + '"><div class="ico">' + ico + '</div><h2>' + titulo + '</h2><p>' + texto + '</p><span class="ir">' + (ico === ICO.quiz ? 'Começar quiz' : 'Abrir resumo') + ' →</span></a>'
      : '<div class="mode off" aria-disabled="true"><div class="ico">' + ico + '</div><h2>' + titulo + '</h2><p>' + emBreve + '</p></div>';
    var baixar = ok && arquivo
      ? '<a class="btn dl" href="' + arquivo + '" download>↓ ' + rotuloBaixar + '</a>'
      : '';
    return '<div class="mbloco">' + card + baixar + '</div>';
  }
  document.getElementById('modos').innerHTML =
    modo(m.resumo || '#', ICO.resumo, 'Resumo', 'Conteúdo organizado para estudar e revisar os principais pontos.', !!m.resumo, 'Resumo em breve.', m.resumoPdf, 'Baixar resumo (PDF)') +
    modo('quiz.html?m=' + encodeURIComponent(m.id), ICO.quiz, 'Quiz', 'Questões com dica, correção imediata e duas explicações.', !!m.quiz, 'Quiz em breve.', m.quizOffline, 'Baixar quiz (.html)');
  if (m.resumo || m.quiz) {
    document.getElementById('dica-offline').hidden = false;
  }
})();
</script>
</body>
</html>
